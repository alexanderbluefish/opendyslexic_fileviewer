<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DyslexicReader" />
  <title>Dyslexia Reader</title>
<!-- iPad Home Screen Icon -->
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/antijingoist/open-dyslexic/master/images/logo.png" />

  <!-- Mammoth.js for DOCX parsing (native bold, headings & inline images) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <!-- PDF.js for legacy PDF parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Regular.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Bold.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Italic.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg-color: #fbf0d9;
      --text-color: #111111;
      --font-size: 22px;
      --line-height: 1.8;
      --letter-spacing: 0.06em;
      --word-spacing: 0.14em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'OpenDyslexic', sans-serif !important;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-text-size-adjust: 100%;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 1000;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input[type="range"] {
      cursor: pointer;
    }

    .color-presets {
      display: flex;
      gap: 6px;
    }

    .preset-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .custom-file-upload {
      background: #0071e3;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      word-spacing: var(--word-spacing);
    }

    /* Clean typography & headings */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-weight: bold;
      margin-top: 1.8em;
      margin-bottom: 0.8em;
      line-height: 1.25;
    }

    h1 { font-size: calc(var(--font-size) * 1.45); border-bottom: 2px solid currentColor; padding-bottom: 6px; }
    h2 { font-size: calc(var(--font-size) * 1.3); }
    h3 { font-size: calc(var(--font-size) * 1.18); }

    p {
      margin-bottom: 1.6em; /* Distinct blank line spacing */
      text-align: left;
    }

    /* Bold & Italic styling */
    strong, b {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-weight: bold !important;
      -webkit-text-stroke: 0.5px currentColor;
    }

    em, i {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-style: italic !important;
    }

    /* Preserved inline images */
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      margin: 24px auto;
      display: block;
      background: #fff;
    }

    /* Preserved tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
    }

    th, td {
      border: 1px solid rgba(0, 0, 0, 0.2);
      padding: 10px;
      text-align: left;
    }

    ul, ol {
      margin: 0 0 1.6em 1.5em;
    }

    li {
      margin-bottom: 0.5em;
    }

    .empty-state {
      text-align: center;
      padding-top: 60px;
      opacity: 0.65;
    }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <label class="custom-file-upload">
        Open File (.docx, .pdf, .txt)
        <input type="file" id="fileInput" accept=".docx,.pdf,.txt,.md,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf" />
      </label>
    </div>

    <div class="toolbar-group">
      <label for="fontSize">Size:</label>
      <input type="range" id="fontSize" min="16" max="44" value="22" />
      <span id="fontSizeDisplay">22px</span>
    </div>

    <div class="toolbar-group">
      <label for="lineHeight">Spacing:</label>
      <input type="range" id="lineHeight" min="1.4" max="2.6" step="0.1" value="1.8" />
    </div>

    <div class="toolbar-group">
      <label>Background:</label>
      <div class="color-presets">
        <button class="preset-btn" style="background: #fbf0d9;" title="Peach Cream" data-bg="#fbf0d9" data-text="#111111"></button>
        <button class="preset-btn" style="background: #e3eedd;" title="Soft Mint" data-bg="#e3eedd" data-text="#142616"></button>
        <button class="preset-btn" style="background: #dcebf7;" title="Soft Blue" data-bg="#dcebf7" data-text="#102538"></button>
        <button class="preset-btn" style="background: #eaeaea;" title="Muted Gray" data-bg="#eaeaea" data-text="#1c1c1c"></button>
        <button class="preset-btn" style="background: #1e1e1e;" title="Night Comfort" data-bg="#1e1e1e" data-text="#d8c593"></button>
      </div>
      <input type="color" id="customBg" value="#fbf0d9" title="Custom Tint" />
    </div>
  </header>

  <main id="readerArea">
    <div class="empty-state">
      <h2>DOCX Native Engine Active</h2>
      <p>Tap "Open File" above to load a .docx or document.</p>
    </div>
  </main>

  <script>
    const readerArea = document.getElementById('readerArea');
    const fileInput = document.getElementById('fileInput');
    const fontSizeSlider = document.getElementById('fontSize');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const lineHeightSlider = document.getElementById('lineHeight');
    const customBg = document.getElementById('customBg');
    const presetBtns = document.querySelectorAll('.preset-btn');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    fontSizeSlider.addEventListener('input', (e) => {
      const val = `${e.target.value}px`;
      document.documentElement.style.setProperty('--font-size', val);
      fontSizeDisplay.textContent = val;
    });

    lineHeightSlider.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--line-height', e.target.value);
    });

    customBg.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const bg = btn.getAttribute('data-bg');
        const text = btn.getAttribute('data-text');
        document.documentElement.style.setProperty('--bg-color', bg);
        document.documentElement.style.setProperty('--text-color', text);
        customBg.value = bg;
      });
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      readerArea.innerHTML = '<div class="empty-state"><h3>Loading document structure...</h3></div>';

      // 1. DOCX Handling (Word Documents)
      if (fileName.endsWith('.docx') || file.type.includes('wordprocessingml')) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          // Mammoth converts Word XML into semantic HTML with bold, italics, headers & inline images
          const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
          readerArea.innerHTML = result.value || '<div class="empty-state"><p>Empty document.</p></div>';
        } catch (err) {
          readerArea.innerHTML = `<div class="empty-state"><h3>Error reading .docx file: ${err.message}</h3></div>`;
        }
      } 
      // 2. PDF Handling
      else if (fileName.endsWith('.pdf') || file.type === 'application/pdf') {
        try {
          const buffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
          readerArea.innerHTML = '';

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            let pageText = '';

            textContent.items.forEach(item => {
              pageText += (item.str + ' ');
            });

            const p = document.createElement('p');
            p.textContent = pageText;
            readerArea.appendChild(p);
          }
        } catch (err) {
          readerArea.innerHTML = `<div class="empty-state"><h3>Error reading PDF: ${err.message}</h3></div>`;
        }
      } 
      // 3. Plain Text / Markdown Handling
      else {
        const reader = new FileReader();
        reader.onload = (evt) => {
          readerArea.innerHTML = '';
          const raw = evt.target.result;
          const paragraphs = raw.split(/\n\s*\n/);
          paragraphs.forEach(para => {
            const cleanPara = para.replace(/\n+/g, ' ').trim();
            if (cleanPara) {
              const p = document.createElement('p');
              p.textContent = cleanPara;
              readerArea.appendChild(p);
            }
          });
        };
        reader.readAsText(file);
      }
    });
    if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('Offline cache registration error:', err);
    });
  });
}

  </script>
</body>
</html>
