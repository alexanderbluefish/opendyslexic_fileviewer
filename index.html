<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DyslexicReader" />
  <title>Dyslexia Reader</title>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Regular.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Bold.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-color: #fbf0d9;
      --text-color: #111111;
      --font-scale: 1.0;
      --letter-spacing: 0.05em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'OpenDyslexic', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-text-size-adjust: 100%;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 1000;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input[type="range"] {
      cursor: pointer;
    }

    .color-presets {
      display: flex;
      gap: 6px;
    }

    .preset-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .custom-file-upload {
      background: #0071e3;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      gap: 24px;
      width: 100%;
    }

    /* Container for each PDF page */
    .page-container {
      position: relative;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    /* Canvas renders original document graphics and images */
    .pdf-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Tint overlay keeps images visible while applying background contrast tint */
    .page-tint-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-color: var(--bg-color);
      mix-blend-mode: multiply;
      opacity: 0.82;
    }

    /* Text layer replaces original text with OpenDyslexic */
    .textLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      line-height: 1.0;
    }

    .textLayer span {
      position: absolute;
      color: var(--text-color) !important;
      font-family: 'OpenDyslexic', sans-serif !important;
      letter-spacing: var(--letter-spacing);
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      background: var(--bg-color); /* Shields original underlying raster text */
      padding: 1px 2px;
      border-radius: 2px;
    }

    /* Plain text fallback viewer */
    #plainTextWrapper {
      max-width: 850px;
      width: 100%;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: calc(20px * var(--font-scale));
      line-height: 1.8;
      padding: 20px;
    }

    .status-msg {
      text-align: center;
      padding: 40px;
      color: rgba(0, 0, 0, 0.6);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <label class="custom-file-upload">
        Open File (.pdf, .txt, .md)
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,text/plain,application/pdf" />
      </label>
    </div>

    <div class="toolbar-group">
      <label for="fontScale">Size:</label>
      <input type="range" id="fontScale" min="0.8" max="1.8" step="0.05" value="1.0" />
      <span id="scaleDisplay">100%</span>
    </div>

    <div class="toolbar-group">
      <label>Background Tint:</label>
      <div class="color-presets">
        <button class="preset-btn" style="background: #fbf0d9;" title="Peach Cream" data-bg="#fbf0d9" data-text="#111111"></button>
        <button class="preset-btn" style="background: #e3eedd;" title="Soft Mint" data-bg="#e3eedd" data-text="#142616"></button>
        <button class="preset-btn" style="background: #dcebf7;" title="Soft Blue" data-bg="#dcebf7" data-text="#102538"></button>
        <button class="preset-btn" style="background: #ffffff;" title="Clean White" data-bg="#ffffff" data-text="#111111"></button>
        <button class="preset-btn" style="background: #e5e5e5;" title="Muted Gray" data-bg="#e5e5e5" data-text="#1c1c1c"></button>
      </div>
      <input type="color" id="customBg" value="#fbf0d9" title="Custom Tint" />
    </div>
  </header>

  <main id="viewerContainer">
    <div class="status-msg">Tap "Open File" to load a PDF with photos or text document.</div>
  </main>

  <script>
    const viewer = document.getElementById('viewerContainer');
    const fileInput = document.getElementById('fileInput');
    const fontScaleSlider = document.getElementById('fontScale');
    const scaleDisplay = document.getElementById('scaleDisplay');
    const customBg = document.getElementById('customBg');
    const presetBtns = document.querySelectorAll('.preset-btn');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentPdf = null;
    let currentScaleMultiplier = 1.0;

    // Controls
    fontScaleSlider.addEventListener('input', (e) => {
      currentScaleMultiplier = parseFloat(e.target.value);
      scaleDisplay.textContent = Math.round(currentScaleMultiplier * 100) + '%';
      document.documentElement.style.setProperty('--font-scale', currentScaleMultiplier);
      if (currentPdf) renderAllPages(currentPdf);
    });

    customBg.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const bg = btn.getAttribute('data-bg');
        const text = btn.getAttribute('data-text');
        document.documentElement.style.setProperty('--bg-color', bg);
        document.documentElement.style.setProperty('--text-color', text);
        customBg.value = bg;
      });
    });

    // File processing
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      viewer.innerHTML = '<div class="status-msg">Loading and rendering document...</div>';

      if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        try {
          const buffer = await file.arrayBuffer();
          currentPdf = await pdfjsLib.getDocument({ data: buffer }).promise;
          await renderAllPages(currentPdf);
        } catch (err) {
          viewer.innerHTML = `<div class="status-msg">Error rendering PDF: ${err.message}</div>`;
        }
      } else {
        // Plain text / Markdown
        currentPdf = null;
        const reader = new FileReader();
        reader.onload = (evt) => {
          viewer.innerHTML = `<div id="plainTextWrapper">${escapeHtml(evt.target.result)}</div>`;
        };
        reader.readAsText(file);
      }
    });

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function renderAllPages(pdf) {
      viewer.innerHTML = '';
      
      // Calculate responsive target width for iPad display
      const targetWidth = Math.min(window.innerWidth - 32, 850);

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const scale = (targetWidth / unscaledViewport.width) * (window.devicePixelRatio || 1);
        const viewport = page.getViewport({ scale: targetWidth / unscaledViewport.width });

        // Container
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-container';
        pageDiv.style.width = `${viewport.width}px`;
        pageDiv.style.height = `${viewport.height}px`;

        // 1. Base Canvas Layer: renders original images, shapes, and figures
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-canvas';
        const ctx = canvas.getContext('2d');
        canvas.width = Math.floor(viewport.width * (window.devicePixelRatio || 1));
        canvas.height = Math.floor(viewport.height * (window.devicePixelRatio || 1));
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        const renderContext = {
          canvasContext: ctx,
          viewport: page.getViewport({ scale: scale })
        };
        await page.render(renderContext).promise;
        pageDiv.appendChild(canvas);

        // 2. Background Tint Overlay
        const tint = document.createElement('div');
        tint.className = 'page-tint-overlay';
        pageDiv.appendChild(tint);

        // 3. Text Overlay: renders OpenDyslexic over original text locations
        const textContent = await page.getTextContent();
        const textLayer = document.createElement('div');
        textLayer.className = 'textLayer';
        textLayer.style.width = `${viewport.width}px`;
        textLayer.style.height = `${viewport.height}px`;

        textContent.items.forEach(item => {
          if (!item.str.trim()) return;

          const span = document.createElement('span');
          span.textContent = item.str;

          // Compute exact page coordinates from transformation matrix
          const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
          const fontSize = Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]) * currentScaleMultiplier;
          
          span.style.left = `${tx[4]}px`;
          span.style.top = `${tx[5] - fontSize}px`;
          span.style.fontSize = `${fontSize}px`;

          textLayer.appendChild(span);
        });

        pageDiv.appendChild(textLayer);
        viewer.appendChild(pageDiv);
      }
    }
  </script>
</body>
</html>
