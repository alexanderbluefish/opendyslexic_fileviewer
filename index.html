<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DyslexicReader" />
  <title>Dyslexia Reader</title>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Regular.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Bold.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Italic.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg-color: #fbf0d9;
      --text-color: #111111;
      --font-size: 22px;
      --line-height: 1.8;
      --letter-spacing: 0.08em;
      --word-spacing: 0.16em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'OpenDyslexic', sans-serif !important;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-text-size-adjust: 100%;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 1000;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input[type="range"] {
      cursor: pointer;
    }

    .color-presets {
      display: flex;
      gap: 6px;
    }

    .preset-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .custom-file-upload {
      background: #0071e3;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .page-block {
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.2);
    }

    .page-header {
      font-size: 0.85em;
      opacity: 0.55;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Heading styling */
    .heading {
      font-size: calc(var(--font-size) * 1.25);
      line-height: calc(var(--line-height) * 0.9);
      letter-spacing: var(--letter-spacing);
      word-spacing: var(--word-spacing);
      margin-top: 1.6em;
      margin-bottom: 0.8em;
      font-weight: bold;
    }

    /* Paragraph styling */
    .paragraph {
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      word-spacing: var(--word-spacing);
      margin-bottom: 1.6em;
      text-align: left;
    }

    strong {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-weight: bold;
    }

    em {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-style: italic;
    }

    .image-wrapper {
      margin: 28px 0;
      text-align: center;
    }

    .extracted-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      background: #fff;
    }

    .empty-state {
      text-align: center;
      padding-top: 60px;
      opacity: 0.65;
    }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <label class="custom-file-upload">
        Open File (.pdf, .txt, .md)
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,text/plain,application/pdf" />
      </label>
    </div>

    <div class="toolbar-group">
      <label for="fontSize">Size:</label>
      <input type="range" id="fontSize" min="16" max="44" value="22" />
      <span id="fontSizeDisplay">22px</span>
    </div>

    <div class="toolbar-group">
      <label for="lineHeight">Spacing:</label>
      <input type="range" id="lineHeight" min="1.4" max="2.6" step="0.1" value="1.8" />
    </div>

    <div class="toolbar-group">
      <label>Background:</label>
      <div class="color-presets">
        <button class="preset-btn" style="background: #fbf0d9;" title="Peach Cream" data-bg="#fbf0d9" data-text="#111111"></button>
        <button class="preset-btn" style="background: #e3eedd;" title="Soft Mint" data-bg="#e3eedd" data-text="#142616"></button>
        <button class="preset-btn" style="background: #dcebf7;" title="Soft Blue" data-bg="#dcebf7" data-text="#102538"></button>
        <button class="preset-btn" style="background: #eaeaea;" title="Muted Gray" data-bg="#eaeaea" data-text="#1c1c1c"></button>
        <button class="preset-btn" style="background: #1e1e1e;" title="Night Comfort" data-bg="#1e1e1e" data-text="#d8c593"></button>
      </div>
      <input type="color" id="customBg" value="#fbf0d9" title="Custom Tint" />
    </div>
  </header>

  <main id="readerArea">
    <div class="empty-state">
      <h2>OpenDyslexic Reader Ready</h2>
      <p>Tap "Open File" above to load a document with preserved headings, bold/italics, and inline photos.</p>
    </div>
  </main>

  <script>
    const readerArea = document.getElementById('readerArea');
    const fileInput = document.getElementById('fileInput');
    const fontSizeSlider = document.getElementById('fontSize');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const lineHeightSlider = document.getElementById('lineHeight');
    const customBg = document.getElementById('customBg');
    const presetBtns = document.querySelectorAll('.preset-btn');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    fontSizeSlider.addEventListener('input', (e) => {
      const val = `${e.target.value}px`;
      document.documentElement.style.setProperty('--font-size', val);
      fontSizeDisplay.textContent = val;
    });

    lineHeightSlider.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--line-height', e.target.value);
    });

    customBg.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const bg = btn.getAttribute('data-bg');
        const text = btn.getAttribute('data-text');
        document.documentElement.style.setProperty('--bg-color', bg);
        document.documentElement.style.setProperty('--text-color', text);
        customBg.value = bg;
      });
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Extract images with coordinate tracking
    async function extractImagesWithPositions(page) {
      const ops = await page.getOperatorList();
      const imageItems = [];
      const visited = new Set();
      let currentMatrix = [1, 0, 0, 1, 0, 0];

      for (let i = 0; i < ops.fnArray.length; i++) {
        const fn = ops.fnArray[i];
        const args = ops.argsArray[i];

        if (fn === pdfjsLib.OPS.transform) {
          currentMatrix = args;
        }

        if (fn === pdfjsLib.OPS.paintImageXObject || fn === pdfjsLib.OPS.paintImageXObjectRepeat) {
          const objId = args[0];
          if (visited.has(objId)) continue;
          visited.add(objId);

          const imgY = currentMatrix[5];

          try {
            const imgData = await new Promise((resolve) => {
              if (page.objs.has(objId)) {
                resolve(page.objs.get(objId));
              } else if (page.commonObjs.has(objId)) {
                resolve(page.commonObjs.get(objId));
              } else {
                page.objs.get(objId, resolve);
              }
            });

            if (imgData && imgData.data && imgData.width > 30 && imgData.height > 30) {
              const canvas = document.createElement('canvas');
              canvas.width = imgData.width;
              canvas.height = imgData.height;
              const ctx = canvas.getContext('2d');

              let fullImageData;
              if (imgData.data.length === imgData.width * imgData.height * 4) {
                fullImageData = new ImageData(new Uint8ClampedArray(imgData.data.buffer), imgData.width, imgData.height);
              } else {
                fullImageData = ctx.createImageData(imgData.width, imgData.height);
                let srcIdx = 0, destIdx = 0;
                for (let p = 0; p < imgData.width * imgData.height; p++) {
                  fullImageData.data[destIdx] = imgData.data[srcIdx];
                  fullImageData.data[destIdx + 1] = imgData.data[srcIdx + 1];
                  fullImageData.data[destIdx + 2] = imgData.data[srcIdx + 2];
                  fullImageData.data[destIdx + 3] = 255;
                  srcIdx += 3;
                  destIdx += 4;
                }
              }
              ctx.putImageData(fullImageData, 0, 0);

              const wrapper = document.createElement('div');
              wrapper.className = 'image-wrapper';
              const img = document.createElement('img');
              img.className = 'extracted-img';
              img.src = canvas.toDataURL();
              wrapper.appendChild(img);

              imageItems.push({
                type: 'image',
                y: imgY,
                element: wrapper
              });
            }
          } catch (e) {
            console.warn('Image parse skipped:', e);
          }
        }
      }
      return imageItems;
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      readerArea.innerHTML = '<div class="empty-state"><h3>Parsing structure, typography, and photos...</h3></div>';

      if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        try {
          const buffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({
            data: buffer,
            isOffscreenCanvasSupported: false
          }).promise;

          readerArea.innerHTML = '';

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textData = await page.getTextContent();
            const images = await extractImagesWithPositions(page);

            // Group text chunks into visual lines while preserving font styles
            const linesByY = [];
            textData.items.forEach(item => {
              if (!item.str.trim()) return;

              const y = Math.round(item.transform[5]);
              const fontSize = Math.round(Math.sqrt(item.transform[0] * item.transform[0] + item.transform[1] * item.transform[1]));
              const fontName = (item.fontName || '').toLowerCase();

              const isBold = fontName.includes('bold') || fontName.includes('black') || fontName.includes('heavy') || fontName.includes('bolder');
              const isItalic = fontName.includes('italic') || fontName.includes('oblique') || fontName.includes('slant');

              let chunkHtml = escapeHtml(item.str);
              if (isBold && isItalic) {
                chunkHtml = `<strong><em>${chunkHtml}</em></strong>`;
              } else if (isBold) {
                chunkHtml = `<strong>${chunkHtml}</strong>`;
              } else if (isItalic) {
                chunkHtml = `<em>${chunkHtml}</em>`;
              }

              const existingLine = linesByY.find(l => Math.abs(l.y - y) <= 4);
              if (existingLine) {
                existingLine.rawText += (existingLine.rawText.endsWith(' ') ? '' : ' ') + item.str;
                existingLine.html += (existingLine.html.endsWith(' ') ? '' : ' ') + chunkHtml;
                existingLine.fontSizes.push(fontSize);
                if (isBold) existingLine.boldChunks++;
                existingLine.totalChunks++;
              } else {
                linesByY.push({
                  y: y,
                  rawText: item.str,
                  html: chunkHtml,
                  fontSizes: [fontSize],
                  boldChunks: isBold ? 1 : 0,
                  totalChunks: 1
                });
              }
            });

            // Sort lines top-to-bottom
            linesByY.sort((a, b) => b.y - a.y);

            // Calculate median body font size & typical line gap
            const allSizes = [];
            linesByY.forEach(l => l.fontSizes.forEach(s => allSizes.push(s)));
            allSizes.sort((a, b) => a - b);
            const medianFontSize = allSizes.length ? allSizes[Math.floor(allSizes.length / 2)] : 12;

            const lineGaps = [];
            for (let i = 1; i < linesByY.length; i++) {
              lineGaps.push(linesByY[i - 1].y - linesByY[i].y);
            }
            lineGaps.sort((a, b) => a - b);
            const typicalGap = lineGaps.length ? lineGaps[Math.floor(lineGaps.length / 2)] : 14;

            // Classify headings vs paragraphs and assemble blocks
            const contentItems = [];
            let currentParaHtml = '';
            let currentParaRaw = '';
            let currentParaY = linesByY.length ? linesByY[0].y : 0;

            function flushParagraph() {
              if (currentParaHtml.trim()) {
                contentItems.push({
                  type: 'paragraph',
                  y: currentParaY,
                  html: currentParaHtml
                });
                currentParaHtml = '';
                currentParaRaw = '';
              }
            }

            for (let i = 0; i < linesByY.length; i++) {
              const current = linesByY[i];
              const maxLineSize = Math.max(...current.fontSizes);
              const isMostlyBold = (current.boldChunks / current.totalChunks) >= 0.7;
              const isHeadingSize = maxLineSize >= medianFontSize * 1.18;
              const isShort = current.rawText.trim().length < 80;

              // True heading detection
              const isHeading = (isHeadingSize || (isMostlyBold && isShort)) && !/[.;]$/.test(current.rawText.trim());

              if (isHeading) {
                flushParagraph();
                contentItems.push({
                  type: 'heading',
                  y: current.y,
                  html: current.html
                });
                continue;
              }

              // Body text logic
              if (!currentParaHtml) {
                currentParaHtml = current.html;
                currentParaRaw = current.rawText;
                currentParaY = current.y;
                continue;
              }

              const prevLine = linesByY[i - 1];
              const gap = prevLine ? (prevLine.y - current.y) : typicalGap;
              const isParagraphGap = gap > (typicalGap * 1.35);
              const endsWithPunctuation = /[.!?:"']$/.test(currentParaRaw.trim());

              if (isParagraphGap && endsWithPunctuation) {
                flushParagraph();
                currentParaHtml = current.html;
                currentParaRaw = current.rawText;
                currentParaY = current.y;
              } else {
                // Remove mid-sentence line wraps
                const hyphenated = currentParaRaw.endsWith('-');
                if (hyphenated) {
                  currentParaHtml = currentParaHtml.slice(0, -1) + current.html;
                  currentParaRaw = currentParaRaw.slice(0, -1) + current.rawText;
                } else {
                  currentParaHtml += ' ' + current.html;
                  currentParaRaw += ' ' + current.rawText;
                }
              }
            }
            flushParagraph();

            // Interleave text and images according to vertical page order
            const allElements = [...contentItems, ...images];
            allElements.sort((a, b) => b.y - a.y);

            // Render page container
            const block = document.createElement('section');
            block.className = 'page-block';

            const header = document.createElement('div');
            header.className = 'page-header';
            header.textContent = `— Page ${pageNum} —`;
            block.appendChild(header);

            allElements.forEach(item => {
              if (item.type === 'heading') {
                const h = document.createElement('h3');
                h.className = 'heading';
                h.innerHTML = item.html;
                block.appendChild(h);
              } else if (item.type === 'paragraph') {
                const p = document.createElement('p');
                p.className = 'paragraph';
                p.innerHTML = item.html;
                block.appendChild(p);
              } else if (item.type === 'image') {
                block.appendChild(item.element);
              }
            });

            readerArea.appendChild(block);
          }
        } catch (err) {
          readerArea.innerHTML = `<div class="empty-state"><h3>Error loading PDF: ${err.message}</h3></div>`;
        }
      } else {
        // Plain text / Markdown fallback
        const reader = new FileReader();
        reader.onload = (evt) => {
          readerArea.innerHTML = '';
          const raw = evt.target.result;
          const paragraphs = raw.split(/\n\s*\n/);
          paragraphs.forEach(para => {
            const cleanPara = para.replace(/\n+/g, ' ').trim();
            if (cleanPara) {
              const p = document.createElement('p');
              p.className = 'paragraph';
              p.textContent = cleanPara;
              readerArea.appendChild(p);
            }
          });
        };
        reader.readAsText(file);
      }
    });
  </script>
</body>
</html>
