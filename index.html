<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DyslexicReader" />
  <title>Dyslexia Reader</title>

  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Regular.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Bold.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'OpenDyslexic';
      src: url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/woff/OpenDyslexic-Italic.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic@master/otf/OpenDyslexic-Italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg-color: #fbf0d9;
      --text-color: #111111;
      --font-size: 22px;
      --line-height: 1.8;
      --letter-spacing: 0.06em;
      --word-spacing: 0.14em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'OpenDyslexic', sans-serif !important;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-text-size-adjust: 100%;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 1000;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input[type="range"] {
      cursor: pointer;
    }

    .color-presets {
      display: flex;
      gap: 6px;
    }

    .preset-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .custom-file-upload {
      background: #0071e3;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="file"] {
      display: none;
    }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .page-block {
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.2);
    }

    .page-header {
      font-size: 0.8em;
      opacity: 0.55;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Headings */
    .heading {
      font-size: calc(var(--font-size) * 1.25);
      line-height: calc(var(--line-height) * 0.95);
      letter-spacing: var(--letter-spacing);
      word-spacing: var(--word-spacing);
      margin-top: 1.8em;
      margin-bottom: 0.8em;
      font-weight: bold;
    }

    /* Paragraphs */
    .paragraph {
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      word-spacing: var(--word-spacing);
      margin-bottom: 1.6em; /* Distinct blank line equivalent */
      text-align: left;
    }

    strong {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-weight: bold;
    }

    em {
      font-family: 'OpenDyslexic', sans-serif !important;
      font-style: italic;
    }

    .image-wrapper {
      margin: 28px 0;
      text-align: center;
    }

    .extracted-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      background: #fff;
    }

    .empty-state {
      text-align: center;
      padding-top: 60px;
      opacity: 0.65;
    }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <label class="custom-file-upload">
        Open File (.pdf, .txt, .md)
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,text/plain,application/pdf" />
      </label>
    </div>

    <div class="toolbar-group">
      <label for="fontSize">Size:</label>
      <input type="range" id="fontSize" min="16" max="44" value="22" />
      <span id="fontSizeDisplay">22px</span>
    </div>

    <div class="toolbar-group">
      <label for="lineHeight">Spacing:</label>
      <input type="range" id="lineHeight" min="1.4" max="2.6" step="0.1" value="1.8" />
    </div>

    <div class="toolbar-group">
      <label>Background:</label>
      <div class="color-presets">
        <button class="preset-btn" style="background: #fbf0d9;" title="Peach Cream" data-bg="#fbf0d9" data-text="#111111"></button>
        <button class="preset-btn" style="background: #e3eedd;" title="Soft Mint" data-bg="#e3eedd" data-text="#142616"></button>
        <button class="preset-btn" style="background: #dcebf7;" title="Soft Blue" data-bg="#dcebf7" data-text="#102538"></button>
        <button class="preset-btn" style="background: #eaeaea;" title="Muted Gray" data-bg="#eaeaea" data-text="#1c1c1c"></button>
        <button class="preset-btn" style="background: #1e1e1e;" title="Night Comfort" data-bg="#1e1e1e" data-text="#d8c593"></button>
      </div>
      <input type="color" id="customBg" value="#fbf0d9" title="Custom Tint" />
    </div>
  </header>

  <main id="readerArea">
    <div class="empty-state">
      <h2>v2.4 Ready</h2>
      <p>Tap "Open File" to load your document.</p>
    </div>
  </main>

  <script>
    const readerArea = document.getElementById('readerArea');
    const fileInput = document.getElementById('fileInput');
    const fontSizeSlider = document.getElementById('fontSize');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const lineHeightSlider = document.getElementById('lineHeight');
    const customBg = document.getElementById('customBg');
    const presetBtns = document.querySelectorAll('.preset-btn');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    fontSizeSlider.addEventListener('input', (e) => {
      const val = `${e.target.value}px`;
      document.documentElement.style.setProperty('--font-size', val);
      fontSizeDisplay.textContent = val;
    });

    lineHeightSlider.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--line-height', e.target.value);
    });

    customBg.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const bg = btn.getAttribute('data-bg');
        const text = btn.getAttribute('data-text');
        document.documentElement.style.setProperty('--bg-color', bg);
        document.documentElement.style.setProperty('--text-color', text);
        customBg.value = bg;
      });
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Resolve font styles directly from page font dictionary
    async function resolveFontStyles(page, items) {
      const fontMap = {};
      const uniqueFontNames = [...new Set(items.map(it => it.fontName).filter(Boolean))];

      await Promise.all(uniqueFontNames.map(fName => {
        return new Promise(resolve => {
          if (page.commonObjs.has(fName)) {
            const fontObj = page.commonObjs.get(fName);
            fontMap[fName] = parseFontObj(fontObj);
            resolve();
          } else {
            page.commonObjs.get(fName, (fontObj) => {
              fontMap[fName] = parseFontObj(fontObj);
              resolve();
            });
          }
        });
      }));

      return fontMap;
    }

    function parseFontObj(fontObj) {
      if (!fontObj) return { isBold: false, isItalic: false };
      const name = (fontObj.name || fontObj.fallbackName || '').toLowerCase();
      const isBold = fontObj.bold || name.includes('bold') || name.includes('black') || name.includes('heavy') || name.includes('w7') || name.includes('w8');
      const isItalic = fontObj.italic || name.includes('italic') || name.includes('oblique') || name.includes('slant');
      return { isBold, isItalic };
    }

    // Extract images with normalized viewport coordinates
    async function extractImagesWithPositions(page, viewport) {
      const ops = await page.getOperatorList();
      const imageItems = [];
      const visited = new Set();
      let ctm = [1, 0, 0, 1, 0, 0];

      for (let i = 0; i < ops.fnArray.length; i++) {
        const fn = ops.fnArray[i];
        const args = ops.argsArray[i];

        if (fn === pdfjsLib.OPS.transform) {
          ctm = args;
        }

        if (fn === pdfjsLib.OPS.paintImageXObject || fn === pdfjsLib.OPS.paintImageXObjectRepeat) {
          const objId = args[0];
          if (visited.has(objId)) continue;
          visited.add(objId);

          // Convert PDF transform to Viewport Y coordinate
          const pt = pdfjsLib.Util.applyTransform([0, 0], ctm);
          const vPt = viewport.convertToViewportPoint(pt[0], pt[1]);
          const screenY = vPt[1]; // Viewport Y flows naturally top-to-bottom

          try {
            const imgData = await new Promise((resolve) => {
              if (page.objs.has(objId)) {
                resolve(page.objs.get(objId));
              } else if (page.commonObjs.has(objId)) {
                resolve(page.commonObjs.get(objId));
              } else {
                page.objs.get(objId, resolve);
              }
            });

            if (imgData && imgData.data && imgData.width > 40 && imgData.height > 40) {
              const canvas = document.createElement('canvas');
              canvas.width = imgData.width;
              canvas.height = imgData.height;
              const ctx = canvas.getContext('2d');

              let fullImageData;
              if (imgData.data.length === imgData.width * imgData.height * 4) {
                fullImageData = new ImageData(new Uint8ClampedArray(imgData.data.buffer), imgData.width, imgData.height);
              } else {
                fullImageData = ctx.createImageData(imgData.width, imgData.height);
                let s = 0, d = 0;
                for (let p = 0; p < imgData.width * imgData.height; p++) {
                  fullImageData.data[d] = imgData.data[s];
                  fullImageData.data[d + 1] = imgData.data[s + 1];
                  fullImageData.data[d + 2] = imgData.data[s + 2];
                  fullImageData.data[d + 3] = 255;
                  s += 3; d += 4;
                }
              }
              ctx.putImageData(fullImageData, 0, 0);

              const wrapper = document.createElement('div');
              wrapper.className = 'image-wrapper';
              const img = document.createElement('img');
              img.className = 'extracted-img';
              img.src = canvas.toDataURL();
              wrapper.appendChild(img);

              imageItems.push({
                type: 'image',
                y: screenY,
                element: wrapper
              });
            }
          } catch (e) {
            console.warn('Image extraction skipped:', e);
          }
        }
      }
      return imageItems;
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      readerArea.innerHTML = '<div class="empty-state"><h3>Parsing structure, typography, and photos...</h3></div>';

      if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        try {
          const buffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({
            data: buffer,
            isOffscreenCanvasSupported: false
          }).promise;

          readerArea.innerHTML = '';

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.0 });
            const textData = await page.getTextContent();

            // 1. Resolve actual font objects from PDF resources
            const fontMeta = await resolveFontStyles(page, textData.items);

            // 2. Extract images with matched viewport Y
            const images = await extractImagesWithPositions(page, viewport);

            // 3. Convert all text items into screen coordinates (Y top-to-bottom)
            const textItems = [];
            textData.items.forEach(item => {
              if (!item.str.trim()) return;
              const pt = viewport.convertToViewportPoint(item.transform[4], item.transform[5]);
              const fontSize = Math.round(Math.sqrt(item.transform[0] * item.transform[0] + item.transform[1] * item.transform[1]));
              const meta = fontMeta[item.fontName] || { isBold: false, isItalic: false };

              textItems.push({
                str: item.str,
                x: pt[0],
                y: pt[1],
                size: fontSize,
                isBold: meta.isBold,
                isItalic: meta.isItalic
              });
            });

            // Group into visual lines (tolerance +/- 3px)
            const lines = [];
            textItems.forEach(it => {
              let line = lines.find(l => Math.abs(l.y - it.y) <= 3);
              if (!line) {
                line = { y: it.y, items: [] };
                lines.push(line);
              }
              line.items.push(it);
            });

            // Sort lines top-to-bottom
            lines.sort((a, b) => a.y - b.y);

            // Assemble each line left-to-right with HTML styling
            const assembledLines = lines.map(line => {
              line.items.sort((a, b) => a.x - b.x);

              let raw = '';
              let html = '';
              let maxFontSize = 0;
              let boldCount = 0;

              line.items.forEach((token, idx) => {
                let tokenHtml = escapeHtml(token.str);
                if (token.isBold && token.isItalic) {
                  tokenHtml = `<strong><em>${tokenHtml}</em></strong>`;
                } else if (token.isBold) {
                  tokenHtml = `<strong>${tokenHtml}</strong>`;
                } else if (token.isItalic) {
                  tokenHtml = `<em>${tokenHtml}</em>`;
                }

                const needsSpace = idx > 0 && (token.x - (line.items[idx - 1].x + line.items[idx - 1].size * 0.5) > 2);
                const separator = (needsSpace && !raw.endsWith(' ')) ? ' ' : '';

                raw += separator + token.str;
                html += separator + tokenHtml;
                if (token.size > maxFontSize) maxFontSize = token.size;
                if (token.isBold) boldCount++;
              });

              return {
                y: line.y,
                raw: raw.trim(),
                html: html.trim(),
                maxFontSize: maxFontSize,
                isMostlyBold: boldCount >= (line.items.length * 0.5)
              };
            });

            // Calculate median font size and median line spacing
            const allSizes = assembledLines.map(l => l.maxFontSize).filter(s => s > 0).sort((a, b) => a - b);
            const medianSize = allSizes.length ? allSizes[Math.floor(allSizes.length / 2)] : 12;

            const spacings = [];
            for (let i = 1; i < assembledLines.length; i++) {
              const diff = assembledLines[i].y - assembledLines[i - 1].y;
              if (diff > 4 && diff < 50) spacings.push(diff);
            }
            spacings.sort((a, b) => a - b);
            const medianSpacing = spacings.length ? spacings[Math.floor(spacings.length / 2)] : 14;

            // Group into Headings and Paragraphs
            const contentBlocks = [];
            let currentParaHtml = '';
            let currentParaRaw = '';
            let currentParaY = assembledLines.length ? assembledLines[0].y : 0;

            function commitPara() {
              if (currentParaHtml.trim()) {
                contentBlocks.push({
                  type: 'paragraph',
                  y: currentParaY,
                  html: currentParaHtml
                });
                currentParaHtml = '';
                currentParaRaw = '';
              }
            }

            for (let i = 0; i < assembledLines.length; i++) {
              const curr = assembledLines[i];
              const prev = assembledLines[i - 1];

              const isHeadingSize = curr.maxFontSize >= (medianSize * 1.18);
              const isShort = curr.raw.length < 80;
              const isHeading = (isHeadingSize || (curr.isMostlyBold && isShort)) && !/[.;]$/.test(curr.raw);

              if (isHeading) {
                commitPara();
                contentBlocks.push({
                  type: 'heading',
                  y: curr.y,
                  html: curr.html
                });
                continue;
              }

              if (!currentParaHtml) {
                currentParaHtml = curr.html;
                currentParaRaw = curr.raw;
                currentParaY = curr.y;
                continue;
              }

              const lineGap = curr.y - prev.y;
              const isDistinctParagraphGap = lineGap > (medianSpacing * 1.38);
              const prevEndsSentence = /[.!?:"']$/.test(currentParaRaw.trim());

              if (isDistinctParagraphGap || (prevEndsSentence && lineGap > medianSpacing * 1.15)) {
                commitPara();
                currentParaHtml = curr.html;
                currentParaRaw = curr.raw;
                currentParaY = curr.y;
              } else {
                // Unwrap mid-sentence line break
                if (currentParaRaw.endsWith('-')) {
                  currentParaHtml = currentParaHtml.slice(0, -1) + curr.html;
                  currentParaRaw = currentParaRaw.slice(0, -1) + curr.raw;
                } else {
                  currentParaHtml += ' ' + curr.html;
                  currentParaRaw += ' ' + curr.raw;
                }
              }
            }
            commitPara();

            // Interleave text blocks and images by visual top-to-bottom order (Y ascending)
            const allElements = [...contentBlocks, ...images];
            allElements.sort((a, b) => a.y - b.y);

            const block = document.createElement('section');
            block.className = 'page-block';

            const header = document.createElement('div');
            header.className = 'page-header';
            header.textContent = `— Page ${pageNum} —`;
            block.appendChild(header);

            allElements.forEach(item => {
              if (item.type === 'heading') {
                const h = document.createElement('h3');
                h.className = 'heading';
                h.innerHTML = item.html;
                block.appendChild(h);
              } else if (item.type === 'paragraph') {
                const p = document.createElement('p');
                p.className = 'paragraph';
                p.innerHTML = item.html;
                block.appendChild(p);
              } else if (item.type === 'image') {
                block.appendChild(item.element);
              }
            });

            readerArea.appendChild(block);
          }
        } catch (err) {
          readerArea.innerHTML = `<div class="empty-state"><h3>Error loading PDF: ${err.message}</h3></div>`;
        }
      } else {
        // Plain text / Markdown
        const reader = new FileReader();
        reader.onload = (evt) => {
          readerArea.innerHTML = '';
          const raw = evt.target.result;
          const paragraphs = raw.split(/\n\s*\n/);
          paragraphs.forEach(para => {
            const cleanPara = para.replace(/\n+/g, ' ').trim();
            if (cleanPara) {
              const p = document.createElement('p');
              p.className = 'paragraph';
              p.textContent = cleanPara;
              readerArea.appendChild(p);
            }
          });
        };
        reader.readAsText(file);
      }
    });
  </script>
</body>
</html>
